<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – CampusCart</title>
  <meta name="description" content="Sign in to your CampusCart student account to buy and sell textbooks, electronics and hostel gear.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>">
  <style>
    .auth-page-wrapper {
      min-height: calc(100vh - var(--header-height));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      background: radial-gradient(circle at 50% 10%, rgba(37, 99, 235, 0.08) 0%, rgba(248, 250, 252, 0) 60%);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 2.5rem;
      box-shadow: var(--shadow-xl);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-header h1 {
      font-size: 1.75rem;
      color: var(--secondary);
      margin-bottom: 0.5rem;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--secondary);
      margin-bottom: 0.4rem;
    }
    .form-input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-family: var(--font-body);
      color: var(--text-main);
      background: var(--bg-surface);
      transition: var(--transition);
    }
    .form-input:focus {
      outline: none;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }
    .alert-box {
      display: none;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      margin-bottom: 1.25rem;
      line-height: 1.4;
    }
    .alert-error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .alert-success {
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }
  </style>
</head>
<body>

  <!-- Sticky Header -->
  <header class="site-header">
    <div class="container nav-container">
      <a href="/" class="brand-logo" aria-label="CampusCart Home">
        <div class="logo-icon">🛒</div>
        <span>CampusCart</span>
        <span class="brand-badge">Campus</span>
      </a>
      <div class="nav-actions">
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Dark/Light Mode">🌙</button>
        <a href="/register.html" class="btn btn-secondary btn-sm">Create Account</a>
      </div>
    </div>
  </header>

  <main class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Welcome Back</h1>
        <p>Sign in with your verified university credentials</p>
      </div>

      <div id="alert-box" class="alert-box" role="alert"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">University Email</label>
          <input type="email" id="email" class="form-input" placeholder="e.g. name@student.rvu.edu.in" required autocomplete="email">
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <label class="form-label" for="password">Password</label>
          </div>
          <input type="password" id="password" class="form-input" placeholder="Enter your account password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn" style="width: 100%; padding: 0.85rem; font-size: 1rem; margin-top: 0.5rem;">
          Sign In to CampusCart
        </button>
      </form>

      <div style="text-align: center; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border); font-size: 0.9rem; color: var(--text-muted);">
        Don't have an account yet? <a href="/register.html" style="color: var(--primary); font-weight: 600;">Register as Student</a>
      </div>
    </div>
  </main>

  <script src="/js/theme.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in, redirect to dashboard or redirect param
      const urlParams = new URLSearchParams(window.location.search);
      const redirectTarget = urlParams.get('redirect') || '/dashboard.html';

      if (window.CampusCartAuth.isAuthenticated()) {
        window.location.href = redirectTarget;
        return;
      }

      const form = document.getElementById('login-form');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const submitBtn = document.getElementById('submit-btn');
      const alertBox = document.getElementById('alert-box');

      function showAlert(msg, isError = true) {
        alertBox.textContent = msg;
        alertBox.className = `alert-box ${isError ? 'alert-error' : 'alert-success'}`;
        alertBox.style.display = 'block';
      }

      function clearAlert() {
        alertBox.style.display = 'none';
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearAlert();

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
          showAlert('Please provide both university email and password.');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Verifying credentials...';

        try {
          const res = await window.CampusCartAPI.post('/auth/login', { email, password });
          if (res && res.data && res.data.token) {
            window.CampusCartAuth.setSession(res.data.token, res.data.user);
            if (window.CampusCartToast) {
              window.CampusCartToast.success(`Welcome back, ${res.data.user.name}!`, 'Signed In');
            }
            showAlert('Sign in successful! Redirecting...', false);
            setTimeout(() => {
              window.location.href = redirectTarget;
            }, 500);
          } else {
            showAlert('Login succeeded but token was missing.');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign In to CampusCart';
          }
        } catch (err) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In to CampusCart';
          const msg = (err.details && Array.isArray(err.details)) 
            ? err.details.join(', ') 
            : (err.message || 'Login failed. Please check your credentials.');
          showAlert(msg);
          if (window.CampusCartToast) {
            window.CampusCartToast.error(msg, 'Authentication Failed');
          }
        }
      });
    });
  </script>
</body>
</html>
